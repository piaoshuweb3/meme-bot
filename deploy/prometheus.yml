# Prometheus 抓取配置（Stage 6 可观测性）
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: memebot-bot
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      # 后端跑在宿主机（8090）；若改为容器内运行，替换为 ["bot:8080"]
      - targets: ["host.docker.internal:8090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
