name: CI

# 触发：推送到 main、以及所有 PR
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go 后端（build / vet / test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      # 国内 runner 可保留；GitHub 官方 runner 直连 proxy.golang.org 即可
      - name: 依赖解析
        run: go mod tidy

      - name: 格式检查
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："; echo "$unformatted"; exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test ./... -count=1 -race

      - name: 编译
        run: |
          go build ./...
          go build -o /tmp/bot ./cmd/bot
          go build -o /tmp/migrator ./cmd/migrator
          go build -o /tmp/worker ./cmd/worker

  web:
    name: Web 前端（typecheck / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build

  app:
    name: Flutter 移动端（analyze）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖解析
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze
